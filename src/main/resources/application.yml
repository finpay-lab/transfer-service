server:
  port: 8082
spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finpay_transfer
    username: finpay
    password: finpay
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      transaction-id-prefix: transfer-

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      service: transfer-service

finpay:
  transfer:
    topics:
      transfer: finpay.transfer
