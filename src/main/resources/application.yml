server:
  port: 8080

spring:
  application:
    name: transfer-service
  datasource:
    url: ${TRANSFER_DB_URL:jdbc:postgresql://localhost:5432/transfer}
    username: ${TRANSFER_DB_USER:transfer}
    password: ${TRANSFER_DB_PASSWORD:transfer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
